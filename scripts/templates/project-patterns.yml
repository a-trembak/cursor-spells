# Optional kit-dogfood only. Do not vendor check-project-patterns.sh into a
# consumer app's scripts/ folder. Requires KIT (absolute path to the
# cursor-spells checkout) on the runner.
name: project-patterns

on:
  pull_request:

jobs:
  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check project patterns cache
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          test -n "$KIT"
          chmod +x "$KIT/scripts/check-project-patterns.sh"
          "$KIT/scripts/check-project-patterns.sh" --strict
